<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Lawin Canvas AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* WELCOME SCREEN */
    #welcomeScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: rgba(0, 0, 0, 0.94);
      color: white;

      text-align: center;
      padding: 30px;
      box-sizing: border-box;
    }

    #welcomeScreen h1 {
      margin: 0 0 12px;
      font-size: 30px;
    }

    #welcomeScreen p {
      max-width: 320px;
      line-height: 1.5;
      margin: 0;
      font-size: 16px;
    }

    #startButton {
      margin-top: 28px;

      padding: 15px 32px;

      border: 0;
      border-radius: 30px;

      background: white;
      color: black;

      font-size: 17px;
      font-weight: bold;
    }

    /* SCAN MESSAGE */
    #scanMessage {
      position: fixed;
      z-index: 5000;

      top: 20px;
      left: 50%;

      transform: translateX(-50%);

      display: none;

      padding: 10px 18px;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.7);
      color: white;

      font-size: 14px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- WELCOME SCREEN -->
  <div id="welcomeScreen">

    <h1>Lawin Canvas</h1>

    <p>
      Welcome to your AR Experience.
      <br><br>
      Tap START, then point your camera at the painting.
    </p>

    <button id="startButton">
      START EXPERIENCE
    </button>

  </div>


  <!-- SCAN MESSAGE -->
  <div id="scanMessage">
    Starting camera...
  </div>


  <!-- AR SCENE -->
  <a-scene

    id="arScene"

    mindar-image="
      imageTargetSrc: assets/targets/targets.mind;
      autoStart: false;
      uiScanning: no;
      uiLoading: no;
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

  >

    <!-- VIDEO -->
    <a-assets>

      <video
        id="video-LC001"
        src="assets/videos/LC001.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        loop
        crossorigin="anonymous"
      ></video>

    </a-assets>


    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- PAINTING TARGET -->
    <a-entity
      id="target-LC001"
      mindar-image-target="targetIndex: 0"
    >

      <a-video
        id="videoPlane"
        src="#video-LC001"
        width="1"
        height="0.6667"
        position="0 0 0"
        material="shader: flat;"
      ></a-video>

    </a-entity>

  </a-scene>


  <script>

    const scene =
      document.getElementById("arScene");

    const welcomeScreen =
      document.getElementById("welcomeScreen");

    const startButton =
      document.getElementById("startButton");

    const scanMessage =
      document.getElementById("scanMessage");

    const video =
      document.getElementById("video-LC001");

    const target =
      document.getElementById("target-LC001");


    let arSystem = null;
    let arStarted = false;


    /* ==========================================
       GET MINDAR SYSTEM
    ========================================== */

    scene.addEventListener("loaded", () => {

      arSystem =
        scene.systems["mindar-image-system"];

      console.log("MindAR system ready");

    });


    /* ==========================================
       START BUTTON
    ========================================== */

    startButton.addEventListener("click", async () => {

      console.log("START EXPERIENCE");

      if (!arSystem) {

        console.log("MindAR is still loading...");

        scanMessage.style.display = "block";
        scanMessage.textContent = "Starting camera...";

        return;

      }


      if (arStarted) {
        return;
      }


      arStarted = true;


      /* Hide welcome screen */

      welcomeScreen.style.display = "none";


      /* Show starting message */

      scanMessage.style.display = "block";
      scanMessage.textContent = "Starting camera...";


      /*
       * IMPORTANT:
       *
       * MindAR was NOT started when the page opened.
       *
       * We start it NOW, directly from the
       * user's START button interaction.
       */

      try {

        arSystem.start();

        console.log("MindAR start requested");

      } catch (error) {

        console.log(
          "MindAR START ERROR:",
          error
        );

        scanMessage.textContent =
          "Camera could not start.";

      }

    });


    /* ==========================================
       AR READY
    ========================================== */

    scene.addEventListener("arReady", () => {

      console.log("MindAR READY");

      scanMessage.style.display = "block";

      scanMessage.textContent =
        "Point your camera at the painting.";

    });


    /* ==========================================
       AR ERROR
    ========================================== */

    scene.addEventListener("arError", (event) => {

      console.log(
        "MindAR ERROR:",
        event
      );

      scanMessage.style.display = "block";

      scanMessage.textContent =
        "Camera could not start.";

    });


    /* ==========================================
       PAINTING FOUND
    ========================================== */

    target.addEventListener(
      "targetFound",
      async () => {

        console.log(
          "LC001 PAINTING FOUND"
        );

        scanMessage.style.display = "none";


        try {

          await video.play();

          console.log(
            "LC001 VIDEO PLAYING"
          );

        } catch (error) {

          console.log(
            "VIDEO PLAY FAILED:",
            error
          );

        }

      }
    );


    /* ==========================================
       PAINTING LOST
    ========================================== */

    target.addEventListener(
      "targetLost",
      () => {

        console.log(
          "LC001 PAINTING LOST"
        );

        video.pause();

      }
    );


    /* ==========================================
       VIDEO STATUS
    ========================================== */

    video.addEventListener(
      "loadeddata",
      () => {

        console.log(
          "LC001 VIDEO DATA LOADED"
        );

      }
    );


    video.addEventListener(
      "canplay",
      () => {

        console.log(
          "LC001 VIDEO CAN PLAY"
        );

      }
    );


    video.addEventListener(
      "playing",
      () => {

        console.log(
          "LC001 VIDEO IS ACTUALLY PLAYING"
        );

      }
    );


    video.addEventListener(
      "pause",
      () => {

        console.log(
          "LC001 VIDEO PAUSED AT:",
          video.currentTime
        );

      }
    );


    video.addEventListener(
      "error",
      () => {

        console.log(
          "LC001 VIDEO ERROR:",
          video.error
        );

      }
    );

  </script>

</body>
</html>
